# Overridable through the environment by Spring relaxed binding:
# SERVER_ADDRESS, SERVER_PORT, AGENTKB_DATA_DIR.
server:
  address: 127.0.0.1
  port: 7411

spring:
  ai:
    mcp:
      server:
        name: agentkb
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

agentkb:
  # The graph lives in <data-dir>/graph (docs/ARCHITECTURE.md §14).
  data-dir: ${user.home}/.local/share/agentkb
  scan:
    # kb_scan reads only under these folders (invariant 9, docs/ARCHITECTURE.md §14); a missing
    # one allows nothing. AGENTKB_SCAN_ALLOWED_ROOTS overrides the list (comma separated).
    allowed-roots: ${user.home}/projects,${user.home}/git
