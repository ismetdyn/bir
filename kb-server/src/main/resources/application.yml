# Overridable through the environment by Spring relaxed binding:
# SERVER_ADDRESS, SERVER_PORT, AGENTKB_DATA_DIR, AGENTKB_REPO.
server:
  address: 127.0.0.1
  port: 7411

spring:
  ai:
    mcp:
      server:
        name: agentkb
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

# agentkb.repo (the knowledge repository kb init creates), agentkb.data-dir (the graph lives in
# <data-dir>/graph) and agentkb.scan.allowed-roots (kb_scan reads only under these, invariant 9; a
# missing one allows nothing) default per OS in AgentkbPaths (ADR-0027 decision 1), not here.
# AGENTKB_HOME, AGENTKB_REPO, AGENTKB_DATA_DIR and AGENTKB_SCAN_ALLOWED_ROOTS (comma separated)
# override them. Tests set the first two in src/test/resources/config/application.yml.
agentkb:
  documents:
    # A document over this size (SI megabytes) needs git-lfs; without it PUT /uploads answers 422
    # (ADR-0025 decision 5).
    lfs-threshold-mb: 20
