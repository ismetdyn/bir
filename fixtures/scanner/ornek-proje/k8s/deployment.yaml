apiVersion: apps/v1
kind: Deployment
metadata:
  name: ornek-proje
  namespace: ornek-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ornek-proje
  template:
    metadata:
      labels:
        app: ornek-proje
    spec:
      containers:
        - name: ornek-proje
          image: registry.ornek.example/ornek/ornek-proje:1.4.2
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: test
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ornek-proje-db
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: ornek-proje
  namespace: ornek-test
spec:
  selector:
    app: ornek-proje
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ornek-proje
  namespace: ornek-test
spec:
  rules:
    - host: ornek-test.ornek.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ornek-proje
                port:
                  number: 80
