stages:
  - build
  - deploy

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - ./mvnw -B verify

deploy_prod:
  stage: deploy
  environment:
    name: production
    url: https://ornek.example
  script:
    - scp target/ornek-proje.jar deploy@ornek-app-01.ornek.example:/opt/ornek-proje/
    - ssh deploy@ornek-app-01.ornek.example "sudo systemctl restart ornek-proje"
  when: manual
  only:
    - main
