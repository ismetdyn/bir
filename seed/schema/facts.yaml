# Fact anahtarları sözlüğü.
# validator: değer biçimi | multi: aynı anahtar + ortam için birden çok güncel değer olabilir mi
# kind: text → serbest metin bilgi (rol, kısıt, erişim, kural...); her zaman multi
# target: port fact'i TARGET kenarıyla bir varlığı gösterebilir ("8443/https → ornek-proje")
# Secret'lar fact değildir; Secret düğümünde durur, değeri bu bilgisayardan çıkmaz (docs/SECRETS.md).
# Metin türündeki fact en fazla 500 karakterdir; uzun metin doküman olarak eklenir (ADR-0017).
version: 2
facts:
  hostname:          {validator: hostname, multi: false}
  ip:                {validator: ip, multi: true}
  port:              {validator: port-spec, multi: true, target: optional}
  url:               {validator: url, multi: true}
  jdbc_url:          {validator: jdbc-url-without-password, multi: false}
  db_name:           {multi: false}
  engine:            {enum: [oracle, postgresql, mysql, mssql, redis, rabbitmq, kafka, mongodb, elasticsearch], multi: false}
  os:                {multi: false}
  version:           {multi: false}
  stack:             {multi: true}     # java-spring, java, kotlin, node, python ...
  java_version:      {multi: false}
  framework_version: {multi: true}     # "spring-boot 3.5.6"
  namespace:         {multi: false}
  image:             {multi: true}
  owner:             {multi: true}
  role:              {kind: text}
  constraint:        {kind: text}
  access:            {kind: text}
  convention:        {kind: text}
  build:             {kind: text}
  finding:           {kind: text}      # tarayıcı bulguları (ör. repoda düz metin secret)

# Ortam adları ve eşanlamlıları (tarayıcı profil/namespace/CI environment adlarını bunlara çevirir)
environments:
  prod:    [prod, production, prd, canli]
  test:    [test, tst, qa, uat]
  dev:     [dev, development, gelistirme]
  local:   [local, localhost, yerel]
  default: [default]
